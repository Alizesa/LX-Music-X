name: Android release

on:
  push:
    branches: [master, Next]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Original source branch
        type: choice
        options: [Next, master]
        default: Next
        required: true
      source_sha:
        description: Complete source SHA to rerun or recover a push without an Actions run
        required: true
        type: string
      before_sha:
        description: Original push before SHA (required for an unregistered push)
        required: false
        type: string
      target_version:
        description: Correct an unallocated target (major.minor.patch, or auto for the default)
        required: false
        type: string

permissions:
  contents: write
  actions: read

# Every push retains its own run. A shared Actions concurrency group would
# replace pending runs and silently omit intermediate master releases.
jobs:
  release:
    name: Reserve, build and publish Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Setup release script runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # reserve inspects historical APKs, so Java and the declared Android tools
      # must be ready before version initialization, not only before building.
      - name: Setup Java for APK verification
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Select declared Android Build Tools
        id: android_tools
        run: node publish/android-tools.cjs

      - name: Ensure declared Android Build Tools are installed
        shell: bash
        env:
          BUILD_TOOLS_VERSION: ${{ steps.android_tools.outputs.version }}
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo '::error::ANDROID_HOME or ANDROID_SDK_ROOT is required'
            exit 1
          fi
          if [ ! -x "$sdk_root/build-tools/$BUILD_TOOLS_VERSION/aapt" ] || [ ! -f "$sdk_root/build-tools/$BUILD_TOOLS_VERSION/lib/apksigner.jar" ]; then
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS_VERSION"
          fi

      - name: Reserve or reuse release version
        id: reservation
        run: node publish/release.cjs reserve

      - name: Inject reserved build metadata
        if: steps.reservation.outputs.reuse_public != 'true'
        run: node publish/release.cjs inject

      - name: Setup build environment
        if: steps.reservation.outputs.reuse_public != 'true'
        uses: ./.github/actions/setup

      - name: Check source and release logic
        if: steps.reservation.outputs.reuse_public != 'true'
        run: |
          npm run lint
          npx tsc --noEmit
          npm test

      - name: Configure release signing
        if: steps.reservation.outputs.reuse_public != 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS || secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          missing=''
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_ALIAS" ] || missing="$missing ANDROID_KEYSTORE_ALIAS"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secrets:$missing (legacy KEYSTORE_* names are also supported)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/lx-music-x-release.keystore

      - name: Build signed APKs
        if: steps.reservation.outputs.reuse_public != 'true'
        working-directory: android
        env:
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS || secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PMYAPP_UPLOAD_STORE_FILE=lx-music-x-release.keystore
          -PMYAPP_UPLOAD_KEY_ALIAS="$KEYSTORE_ALIAS"
          -PMYAPP_UPLOAD_STORE_PASSWORD="$KEYSTORE_PASSWORD"
          -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify APKs and prepare immutable update manifest
        if: steps.reservation.outputs.reuse_public != 'true'
        run: node publish/release.cjs prepare

      - name: Preserve prepared release artifacts
        if: steps.reservation.outputs.reuse_public != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.reservation.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/artifacts/*
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish complete release and advance its channel
        run: node publish/release.cjs publish

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/app/lx-music-x-release.keystore
