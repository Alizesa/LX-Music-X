name: Run build test

on:
  pull_request:
    branches:
      - master
      - Next

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Eslint check
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Branch pushes are checked by the unified release workflow; this workflow
      # checks pull requests before they reach either release branch.
      - name: Setup Java
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle

      - name: Test Build
        if: github.event_name == 'pull_request'
        run: npm run build-test

      - name: Android debug build
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
