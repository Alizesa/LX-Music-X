// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 36
        targetSdkVersion = 29

        // 跟着 GitHub runner 镜像自带的版本走。镜像只保证自带这几版
        // （27.3.13750724 / 29.0.14206865 / 30.0.16248370，前者是默认），
        // 原来 pin 的 26.1.10909125 已经不在镜像里了 —— Gradle 会去下载它，
        // 下载/授权失败就直接在配置阶段抛 InstallFailedException。
        ndkVersion = "27.3.13750724"
        kotlinVersion = "1.9.24" // Or any version above 1.3.x
        RNNKotlinVersion = kotlinVersion

        // https://github.com/dream-horizon-org/react-native-fast-image/blob/main/docs/app-glide-module.md
        excludeAppGlideModule = true
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.1')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"
